<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Administration</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <a href="dashboard.html">Simulateur Décodeurs</a>
        </div>
        <ul class="nav-links">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="GestionDecodeur.html">Décodeurs</a></li>
          <li><a href="admin.html" id="nav-admin-link">Admin</a></li>
        </ul>
        <div class="nav-logout">
          <button id="btn-logout">Déconnexion</button>
        </div>
      </div>
    </nav>
    <div class="login-container">
      <div class="login-card">
        <h1>Ajouter un client</h1>
        <input
          type="text"
          id="client-name"
          name="client-name"
          placeholder="Nom du client"
          required
        />
        <input
          type="email"
          id="client-email"
          name="client-email"
          placeholder="Email du client"
          required
        />
        <input
          type="text"
          id="client-code"
          name="client-code"
          placeholder="Code permanent (AAAA00000000)"
          required
          name="client-code"
          pattern="[A-Z]{4}[0-9]{8}"
          required
        />
        <input
          type="password"
          id="client-password"
          name="client-password"
          placeholder="Mot de passe"
          required
        />
        <input
          type="password"
          id="client-confirm-password"
          name="client-confirm-password"
          placeholder="Confirmer le mot de passe"
          required
        />
        <!--<button type="button" onclick="createClient()">Ajouter le client</button>-->
        <button type="button" id="btn-create-client">Ajouter le client</button>
        <div id="client-creation-message"></div>
        <a href="admin.html">Retour à la liste des clients</a>
      </div>
    </div>
    <div class="footer">
      <p>&copy; 2026 INF1007 - Projet de session</p>
    </div>

    <script type="module" src="../js/controllers/clientController.js"></script>
  </body>
</html>
