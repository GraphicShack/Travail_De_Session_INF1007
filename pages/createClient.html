<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Administration</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <a href="dashboard.html">Simulateur Décodeurs</a>
        </div>
        <ul class="nav-links">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="GestionDecodeur.html">Décodeurs</a></li>
          <li><a href="admin.html" id="nav-admin-link">Admin</a></li>
        </ul>
        <div class="nav-logout">
          <button id="btn-logout">Déconnexion</button>
        </div>
      </div>
    </nav>
    <div class="container">
      <h1>Administration</h1>
      <div class="admin-subtitle">
        <h2>Ajouter un client</h2>
      </div>
      <form id="client-creation-form">
        <label for="client-name">Nom du client :</label>
        <input type="text" id="client-name" name="client-name" required />
        <label for="client-email">Email du client :</label>
        <input type="email" id="client-email" name="client-email" required />
        <label for="client-code">Code permanent (AAAA00000000) :</label>
        <input type="text" id="client-code" name="client-code" pattern="[A-Z]{4}[0-9]{8}" required />
        <label for="client-password">Mot de passe :</label>
        <input type="password" id="client-password" name="client-password" required />
        <label for="client-confirm-password">Confirmer le mot de passe :</label>
        <input type="password" id="client-confirm-password" name="client-confirm-password" required />
        <button type="button" onclick="createClient()">Ajouter le client</button>
      </form>
      <div id="client-creation-message"></div>
      <a href="admin.html">Retour à la liste des clients</a>
    </div>
    <div class="footer">
      <p>&copy; 2026 INF1007 - Projet de session</p>
    </div>

    <script src="../js/script.js"></script>
  </body>
</html>
